name: ReSONANCE PS4 cloud SDK and source gate
on:
  push:
    branches:
      - resonance-ps4-cloud-build-20261118
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ps4-source-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
      - name: Prepare report directory
        run: mkdir -p reports
      - name: Clone exact ReSONANCE v01.41 and Flycast v2.7 with submodules
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v01.41 https://github.com/iHaiDeeZ/Resonance.git /tmp/resonance
          git clone --depth 1 --branch v2.7 --recurse-submodules --shallow-submodules https://github.com/flyinghead/flycast.git /tmp/flycast
          git -C /tmp/resonance rev-parse HEAD | tee reports/resonance_commit.txt
          git -C /tmp/flycast rev-parse HEAD | tee reports/flycast_commit.txt
          git -C /tmp/flycast submodule status --recursive | tee reports/submodules.txt
          python3 - <<'PY'
          import pathlib,subprocess
          p=pathlib.Path('/tmp/flycast/.gitmodules')
          s=subprocess.check_output(['git','config','-f',str(p),'--get-regexp',r'^submodule\..*\.path$'],text=True)
          paths=[x.split(' ',1)[1].strip() for x in s.splitlines()]
          missing=[x for x in paths if not any((pathlib.Path('/tmp/flycast')/x).iterdir())]
          print('submodules:',len(paths),'missing:',missing)
          pathlib.Path('reports/modules_check.txt').write_text('total='+str(len(paths))+'\nmissing='+str(missing)+'\n')
          if missing: raise SystemExit(12)
          PY
      - name: Check original upstream PS4 patch compatibility with Flycast 2.7
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/flycast
          if git apply --check /tmp/resonance/patches/flycast-ps4.patch > "$GITHUB_WORKSPACE/reports/upstream_patch_check.txt" 2>&1; then
            echo compatible | tee -a "$GITHUB_WORKSPACE/reports/upstream_patch_check.txt"
          else
            echo "PATCH_NOT_COMPATIBLE: upstream ReSONANCE patch was built for a different Flycast commit. Run8 rebase is required." | tee -a "$GITHUB_WORKSPACE/reports/upstream_patch_check.txt"
          fi
      - name: Provision public OpenOrbis/Mesa toolchain
        uses: orbis-ports/orbis-porting-kit/.github/actions/setup-orbis@v1
      - name: Inspect actual SDK layout and test ReSONANCE configure prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          {
            printf 'OO_PS4_TOOLCHAIN=%s\n' "${OO_PS4_TOOLCHAIN:-}"
            printf 'ORBIS_COMPAT_DIR=%s\n' "${ORBIS_COMPAT_DIR:-}"
            printf 'ORBIS_MESA_BUILD=%s\n' "${ORBIS_MESA_BUILD:-}"
            command -v clang || true
            command -v clang-21 || true
            find "${OO_PS4_TOOLCHAIN:-/nonexistent}" -maxdepth 3 -name ps4.cmake -o -name ps4vars.sh 2>/dev/null || true
            test -f "${OO_PS4_TOOLCHAIN}/ps4vars.sh" || { echo 'ReSONANCE PacBrew ps4vars.sh missing'; exit 31; }
            test -f "${OO_PS4_TOOLCHAIN}/cmake/ps4.cmake" || { echo 'ReSONANCE PacBrew cmake/ps4.cmake missing'; exit 32; }
          } 2>&1 | tee reports/sdk_layout.txt
      - name: Preserve logs regardless of failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resonance-ps4-cloud-diagnostics
          path: reports/
          if-no-files-found: warn
          retention-days: 14
